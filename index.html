<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة شغف التعليمية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae0fd',
                            300: '#7cc5fb',
                            400: '#36a9f7',
                            500: '#0c8de9',
                            600: '#006ec7',
                            700: '#0058a3',
                            800: '#054b86',
                            900: '#0a3f6f',
                        }
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f8fc;
            color: #1e293b;
        }
        /* Ensure buttons are fully clickable and interactive */
        button, input, select {
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        .tab-btn.active {
            background-color: #0c8de9 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(12, 141, 233, 0.25);
        }
        .role-btn.active {
            border-color: #0c8de9 !important;
            background-color: #e0effe !important;
            color: #0058a3 !important;
        }
        .filter-btn.active {
            background-color: #0c8de9 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-between">

    <!-- Header Navigation -->
    <header id="appHeader" class="hidden bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-brand-500/20">
                    ش
                </div>
                <div>
                    <h1 class="font-extrabold text-slate-800 text-lg leading-none">شَغَفْ</h1>
                    <span class="text-[10px] text-brand-600 font-semibold tracking-wider">طليعة الإبداع المدرسي</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div id="userBadge" class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                    <div id="userAvatar" class="w-7 h-7 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-xs">
                        ط
                    </div>
                    <div class="text-xs text-right">
                        <div id="navUserName" class="font-bold text-slate-700">بسمة</div>
                        <div id="navUserRole" class="text-[10px] text-slate-500">طالبة</div>
                    </div>
                </div>

                <button onclick="logout()" title="تسجيل الخروج" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-500 transition-colors flex items-center justify-center">
                    <i class="fa-solid font-bold fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6">

        <!-- ==================== AUTH SECTION ==================== -->
        <section id="authSection" class="max-w-md mx-auto my-6">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white text-3xl font-extrabold shadow-xl shadow-brand-500/25 mb-4">
                    شغف
                </div>
                <h2 class="text-2xl font-black text-slate-800">منصة شَغَفْ التعليمية</h2>
                <p class="text-slate-500 text-sm mt-1">منصة الأنشطة والمسابقات المدرسية والتطوع</p>
                
                <div class="inline-flex items-center gap-1.5 mt-3 px-3 py-1 bg-brand-50 border border-brand-100 text-brand-700 text-xs rounded-full font-medium">
                    <i class="fa-solid fa-heart text-rose-500"></i>
                    <span>صاحب التطبيق: <strong>بسمة دان & بسمة بدماسي</strong></span>
                </div>
            </div>

            <!-- Auth Form Card -->
            <div class="bg-white border border-slate-200/80 rounded-2xl shadow-xl shadow-slate-200/50 p-6 relative z-20">
                <!-- Login / Register Switch Tabs -->
                <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                    <button type="button" id="loginTabBtn" onclick="setAuthMode('login')" class="tab-btn active flex-1 py-2.5 text-center text-sm font-bold rounded-lg transition-all text-slate-700">
                        تسجيل الدخول
                    </button>
                    <button type="button" id="registerTabBtn" onclick="setAuthMode('register')" class="tab-btn flex-1 py-2.5 text-center text-sm font-bold text-slate-600 rounded-lg transition-all">
                        إنشاء حساب جديد
                    </button>
                </div>

                <!-- Role Selection -->
                <div class="mb-5">
                    <label class="block text-xs font-bold text-slate-600 mb-2">نوع الحساب:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="roleStudentBtn" onclick="setRole('student')" class="role-btn active p-3 rounded-xl border border-slate-200 text-center flex flex-col items-center gap-1.5 transition-all text-slate-700">
                            <i class="fa-solid fa-graduation-cap text-lg"></i>
                            <span class="text-xs font-bold">طالبة</span>
                        </button>
                        <button type="button" id="roleTeacherBtn" onclick="setRole('teacher')" class="role-btn p-3 rounded-xl border border-slate-200 text-center flex flex-col items-center gap-1.5 transition-all text-slate-600">
                            <i class="fa-solid fa-chalkboard-user text-lg"></i>
                            <span class="text-xs font-bold">معلمة</span>
                        </button>
                    </div>
                </div>

                <!-- Form Fields -->
                <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    
                    <!-- Dynamic Name Field (Registration Only) -->
                    <div id="fullNameGroup" class="hidden">
                        <label id="fullNameLabel" class="block text-xs font-bold text-slate-700 mb-1">اسم الطالبة الثلاثي</label>
                        <input type="text" id="regFullName" placeholder="أدخلي اسمك الكامل" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
                    </div>

                    <!-- Dynamic Student Grade/Class Fields (Registration Only) -->
                    <div id="studentClassGroup" class="hidden grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الصف الدراسي</label>
                            <select id="regGrade" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:border-brand-500">
                                <option value="الأول ثانوي">الأول ثانوي</option>
                                <option value="الثاني ثانوي">الثاني ثانوي</option>
                                <option value="الثالث ثانوي">الثالث ثانوي</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text
